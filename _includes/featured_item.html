<div class="featured-section">
  <h2>Featured</h2>
  <div class="featured-content">
    <a href="{{ include.item.link }}">
        <img src="{{ site.url }}{{ site.baseurl }}{{ include.item.image }}" alt="{{ include.item.alt }}" />
    </a>
    <p class="featured-caption">
        {{ include.item.caption }}
    </p>
  </div>
</div>

- title: "1. Expanding Click Chemistry with SuFEx and SuPhenEx"
  image: "/images/respic/click_chem.png"
  alt: "Click Chemistry"
  text: "The Nobel Prize-winning concept of 'click chemistry' has transformed how scientists build molecules. My work builds upon this foundation by exploring and expanding a powerful new variant: the Sulfur(VI) Phenolate Exchange (SuPhenEx) reaction. By replacing fluoride with a wide of phenols, SuPhenEx offers a more versatile, synthetically appealing, and environmentally friendly approach to creating advanced materials and molecules."

- title: "2. Highlight: Dynamic, Fast, and Enantiospecific Reactions"
  image: "/images/respic/dft.png"
  alt: "Dynamic Reactions"
  text: "What if click chemistry could be both dynamic and precisely controlled to produce a specific 3D structure (enantiomer)? Our work on the SuPhenEx reaction demonstrated that this is possible. We found that the reaction is not only fast—finishing in minutes at room temperature with high yields—but is also enantiospecific. This allows for the creation of both enantiomers from a single starting material and can even bypass the need for fluorine chemistry altogether, avoiding issues like racemization. By combining the precision of click chemistry with dynamic covalent behavior, SuPhenEx opens new doors for asymmetric synthesis and the design of stable, yet degradable, polymers."

- title: "3. The Surprise: Uncovering the Dominant Role of Entropy"
  image: "/images/respic/multimodal-sufex.png"
  alt: "Entropy vs Enthalpy"
  text: "For years, the key to speeding up click reactions was thought to be lowering the <strong>activation enthalpy (ΔH‡)</strong>. Our detailed kinetic and computational studies of SuFEx and SuPhenEx reactions revealed a surprising twist: <strong>activation entropy (ΔS‡)</strong>, a measure of molecular disorder, often plays the dominant role in determining the reaction rate. In some cases, the reaction is controlled by a mixture of both factors, while in others, it is dominated by entropy alone. This finding challenges a long-standing belief and highlights the importance of considering entropic effects in the design of new and more efficient chemistries."

- title: "4. Isolating the Problem: A Deep Dive into Enthalpy"
  image: "" # Leave empty for no image
  alt: "Enthalpy"
  text: "To better understand the forces at play, we needed to isolate the <strong>enthalpic contributions</strong>. Using Density Functional Theory (DFT) and the Activation Strain Model, we analyzed a series of SuPhenEx reactions. We discovered that in the gas phase, the reactivity is controlled by the HOMO-LUMO orbital interactions, which can be precisely tuned by changing the electronic substituents. In polar solvents, the control mechanism shifts, and electrostatic stabilization becomes the dominant factor. These insights provide a clear roadmap for experimentally designing more efficient S(VI) substitution reactions by controlling the enthalpic component."

- title: "5. The Next Frontier: Modeling Entropy with AIMD and Machine Learning"
  image: "" # Leave empty for no image
  alt: "Modeling Entropy"
  text: "Building on our detailed understanding of enthalpy, my future work is focused on the more elusive factor: entropy. By using a combination of <strong>Ab Initio Molecular Dynamics (AIMD)</strong> and <strong>Machine Learning (ML)</strong>, the goal is to simulate and predict the entropic contributions to these reactions. By modeling the real-time, dynamic dance of molecules as they react, we can build predictive models that will allow for the rational design of reactions where both enthalpy and entropy are optimized for maximum efficiency and control."
- title: "Multimodal S(VI) Exchange Click Reactions Derived from SF2 Moieties: Comparative Kinetics and Stereochemistry of SuFEx and SuPhenEx Reactions"
  image: multimodal-sufex.png
  description: "What really controls the rate of click reactions? For years, chemists have focused on lowering activation enthalpy (ΔH‡), assuming it’s the key. But what if that assumption is wrong? In a series of SuFEx and SuPhenEx reactions, we found that activation entropy (ΔS‡), not enthalpy, plays the dominant role. This challenges a long-standing belief. Enthalpy is well understood and predictable; entropy, much less so. Yet as we push for more efficient, sustainable chemistry, understanding disorder may be the real key."
  authors: "Yumei Zhu, Akash Krishna, Yang Chao, Xixi Li, Sidharam P. Pujari, Guanna Li, Hong Huang, Hongxia Zhao, Jiajia Dong, Han Zuilhof"
  link:
    url: "https://pubs.acs.org/doi/10.1021/acs.joc.5c00615"
    display: "J. Org. Chem. 2025"
  highlight: 1

- title: "Substituent and Solvent Effects on SuPhenEx Click Reactions"
  image: SuFEx-SuPhenEx-EDA.png
  description: "Can enthalpy alone explain reactivity in SuPhenEx reactions? By isolating enthalpic contributions, we show that in the gas phase, reactivity is driven by orbital interactions, tunable via electronic substituents. In polar solvents, enthalpic control shifts toward electrostatic stabilization, shaped by solvent-induced charge distributions. This deeper understanding offers a clear path to designing more efficient S(VI) substitution reactions."
  authors: "Akash Krishna, Pau Besalu, F.M. Bickelhaupt, Guanna Li, Han Zuilhof"
  link:
    url: "submitted" 
    display: "ChemEurJ 2025"
  highlight: 1

- title: "Ligand-Bound CO2 as a Nonclassical Route toward Efficient Photocatalytic CO2 Reduction with a Ni N-Confused Porphyrin"
  image: ligand-CO2.png
  description: "Can ligands do more than just support the metal? We discovered that a Ni(II) N-confused porphyrin (NiNCP), featuring an acidic N–H group, achieves exceptional CO₂ reduction activity, with a TON of 217,000 and 98% selectivity for CO. Unlike its inactive parent complex (NiTPP), NiNCP operates through a nonclassical pathway where the ligand itself activates CO₂ via nucleophilic attack. This metal–ligand synergy reshapes how we think about catalyst design for small molecule activation."
  authors: "Huihong Yuan, Akash Krishna, Zhihe Wei, Yanhui Su, Jinzhou Chen, Wei Hua, Zhangyi Zheng, Daqi Song, Qiaoqiao Mu, Weiyi Pan, Long Xiao, Jin Yan, Guanna Li, Wenjun Yang, Zhao Deng, and Yang Peng"
  link:
    url: "https://pubs.acs.org/doi/abs/10.1021/jacs.3c14717" 
    display: "Journal of the American Chemical Society 2024 146 (15), 10550-10558"
  highlight: 1

- title: "Another Potential Click Reaction: SuPhenEx – A Computational Insight"
  image: Substituents_Eprofile.png
  description: "What really drives bond formation in SuPhenEx reactions? While SuFEx has advanced click chemistry, it often depends on added reagents and tightly controlled conditions. To address this, we generalize S(VI) exchange through SuPhenEx, replacing nitrophenolate with a wide range of phenols ranging from EDG to EWG. Using DFT and Energy Decomposition Analysis (EDA), we go beyond total energy comparisons to uncover the fundamental interactions that drive reactivity. I had the opportunity to share this work with the chemistry world at IUPAC/CHAINS 2023 in The Hague, Netherlands."
  authors: "A. Krishna, G. Li, H. Zuilhof"
  link:
    url: "https://library.wur.nl/WebQuery/edepot/647916" 
    display: "Book of abstracts: connecting chemical worlds. IUPAC, p. 307 O46-0783 (2023)"
  highlight: 1

- title: "Sulfur–Phenolate Exchange: SuFEx-Derived Dynamic Covalent Reactions and Degradation of SuFEx Polymers"
  image: Dynamic-SuphenEx.png
  description: "What if click chemistry could be dynamic and enantiospecific? The SuPhenEx reaction, a sulfur(VI)–phenolate exchange, achieves just that. It proceeds within minutes at room temperature, is fast, enantiospecific, and shows broad functional group tolerance. It enables access to both sulfonimidate enantiomers from a single precursor and can bypass fluoride intermediates, avoiding issues like racemization and surface etching. By combining dynamic covalent behavior with click-like precision, SuPhenEx unlocks new possibilities for asymmetric synthesis and the design of stable yet degradable polymers."
  authors: "Yang Chao, Akash Krishna, Dr. Muthusamy Subramaniam, Dr. Dong-Dong Liang, Dr. Sidharam P. Pujari, Prof. Andrew C.-H. Sue, Dr. Guanna Li, Dr. Fedor M. Miloserdov, Prof. Dr. Han Zuilhof"
  link:
    url: "https://onlinelibrary.wiley.com/doi/10.1002/anie.202207456" 
    display: "Angew. Chem. Int. Ed. 2022, 61, e202207456"
  highlight: 1

- title: "Chitosan nanoparticles as a promising tool in nanomedicine with particular emphasis on oncological treatment"
  image: Chitosan.png
  description: "Can chitosan nanoparticles reshape drug delivery? In this review, we explored the growing role of chitosan-based nanomaterials in medicine, with a focus on their properties, safety, and promising applications in drug delivery. We examined how chitosan nanoparticles enhance bioavailability, targeting specificity, and reduce toxicity, making them valuable for nanomedicine, drug development, and especially anticancer therapy. With insights from recent pre-clinical and clinical studies, the review highlights how chitosan is paving the way for safer, more effective drug delivery systems in modern medicine."
  authors: "Javad Sharifi-Rad, Cristina Quispe, Monica Butnariu, Lia Sanda Rotariu, Oksana Sytar, Simona Sestito, Simona Rapposelli, Muhammad Akram, Mehwish Iqbal, Akash Krishna, Nanjangud Venkatesh Anil Kumar, Susana S. Braga, Susana M. Cardoso, Karolina Jafernik, Halina Ekiert, Natália Cruz-Martins, Agnieszka Szopa, Marcelo Villagran, Lorena Mardones, Miquel Martorell, Anca Oana Docea & Daniela Calina"
  link:
    url: "https://link.springer.com/article/10.1186/s12935-021-02025-4" 
    display: "Cancer Cell Int 21, 318 (2021)"